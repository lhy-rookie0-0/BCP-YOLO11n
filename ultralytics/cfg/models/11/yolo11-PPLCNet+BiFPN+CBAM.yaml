# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 8 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]


# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, PPLCStem, [64, 3, 2]] # 0-P1/2, Conv-BN-h-swish
  - [-1, 1, DepSepConv, [128, 3, 2, False]] # 1-P2/4
  - [-1, 2, DepSepConv, [256, 3, 1, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, DepSepConv, [512, 3, 1, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, DepSepConv, [512, 3, 1, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, DepSepConv, [1024, 3, 1, True]]
  - [-1, 1, CBAM, []] # 9: backbone attention before SPPF
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

# BiFPN-based neck: two top-down and two bottom-up fusion nodes; Detect uses P3/P4/P5.
head:
  - [4, 1, Conv, [256, 1, 1]]  # 12: P3 lateral, 64 channels at n scale
  - [6, 1, Conv, [256, 1, 1]]  # 13: P4 lateral
  - [11, 1, Conv, [256, 1, 1]] # 14: P5 lateral

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15: P5 -> P4
  - [[-1, 13], 1, Bi_FPN, []] # 16: 2-input top-down fusion
  - [-1, 3, C3k2, [256, False]] # 17: T4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18: P4 -> P3
  - [[-1, 12], 1, Bi_FPN, []] # 19: 2-input top-down fusion
  - [-1, 3, C3k2, [256, False]] # 20: T3

  # Four-node design: T3 is also O3; no additional B2-to-O3 fusion.
  - [-1, 1, Conv, [256, 3, 2]] # 21: O3 -> P4
  - [[-1, 13, 17], 1, Bi_FPN, []] # 22: 3-input bottom-up fusion
  - [-1, 3, C3k2, [512, False]] # 23: O4, stride 16
  - [-1, 1, SCDown, [256, 3, 2]] # 24: O4 -> P5
  - [[-1, 14], 1, Bi_FPN, []] # 25: 2-input bottom-up fusion
  - [-1, 3, C3k2, [1024, True]] # 26: O5, stride 32
  - [[20, 23, 26], 1, Detect, [nc]] # O3, O4, O5
